[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

    # Flatpak repository descriptors embed a public OpenPGP trust key. Restrict
    # the exception to that schema field and exact file.
    [[rules.allowlists]]
    description = "Flathub public repository signing key"
    condition = "AND"
    regexTarget = "match"
    paths = ['''packages/shadowfetch-branding/data/usr/share/shadowfetch/flathub\.flatpakrepo$''']
    regexes = ['''^GPGKey=''']

    # Cloudflare Web Analytics injects this public site identifier into browser
    # JavaScript. It is not an API credential. Match only the named 32-hex field.
    [[rules.allowlists]]
    description = "Public Cloudflare Web Analytics site token"
    condition = "AND"
    regexTarget = "line"
    paths = ['''web/shadowfetch-linux-worker/src/index\.js$''']
    regexes = ['''CLOUDFLARE_WEB_ANALYTICS_TOKEN\s*=\s*"[0-9a-f]{32}"''']

    # The release pointer's `key` field is an R2 OBJECT PATH, not a credential:
    # `releases/shadowfetch-<version>-amd64.iso`. The default generic-api-key
    # rule matches on the field NAME plus entropy, and a version-stamped object
    # path clears the entropy floor -- so the pointer schema's own tests, whose
    # whole subject is which key values are acceptable, cannot be written
    # without tripping it. Narrowed to that one field, in that one file,
    # holding a value that is exactly an ISO filename with an optional release
    # prefix. Nothing that could authenticate to anything has that shape.
    [[rules.allowlists]]
    description = "Release-pointer R2 object path in the pointer schema's tests"
    condition = "AND"
    regexTarget = "line"
    paths = ['''web/shadowfetch-linux-worker/tests/test_release_pointer\.py$''']
    regexes = ['''"iso\.key":\s*"(releases/)?shadowfetch-[0-9]+\.[0-9]+\.[0-9]+-amd64\.iso"''']

    # KDE publishes these OpenPGP fingerprints for release-source verification.
    # They identify public signing keys and cannot authenticate to a service.
    [[rules.allowlists]]
    description = "Verified public KDE release signing fingerprints"
    condition = "AND"
    regexTarget = "line"
    paths = ['''packages/shadowfetch-drkonqi-pickup/vendor/provenance\.json$''']
    regexes = [
      '''^\s*"verified_release_key_fingerprint":\s*"0AAC775BB6437A8D9AF7A3ACFE0784117FBCE11D",\s*$''',
      '''^\s*"verified_signing_subkey_fingerprint":\s*"B3CB366552540BE06EE9AD9711968C44928CAEFC",\s*$''',
    ]
