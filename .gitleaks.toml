[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

    # Flatpak repository descriptors embed a public OpenPGP trust key. Restrict
    # the exception to that schema field and exact file.
    [[rules.allowlists]]
    description = "Flathub public repository signing key"
    condition = "AND"
    regexTarget = "match"
    paths = ['''packages/shadowfetch-branding/data/usr/share/shadowfetch/flathub\.flatpakrepo$''']
    regexes = ['''^GPGKey=''']

    # Cloudflare Web Analytics injects this public site identifier into browser
    # JavaScript. It is not an API credential. Match only the named 32-hex field.
    [[rules.allowlists]]
    description = "Public Cloudflare Web Analytics site token"
    condition = "AND"
    regexTarget = "line"
    paths = ['''web/shadowfetch-linux-worker/src/index\.js$''']
    regexes = ['''CLOUDFLARE_WEB_ANALYTICS_TOKEN\s*=\s*"[0-9a-f]{32}"''']

    # KDE publishes these OpenPGP fingerprints for release-source verification.
    # They identify public signing keys and cannot authenticate to a service.
    [[rules.allowlists]]
    description = "Verified public KDE release signing fingerprints"
    condition = "AND"
    regexTarget = "line"
    paths = ['''packages/shadowfetch-drkonqi-pickup/vendor/provenance\.json$''']
    regexes = [
      '''^\s*"verified_release_key_fingerprint":\s*"0AAC775BB6437A8D9AF7A3ACFE0784117FBCE11D",\s*$''',
      '''^\s*"verified_signing_subkey_fingerprint":\s*"B3CB366552540BE06EE9AD9711968C44928CAEFC",\s*$''',
    ]
