set timeout=10
set default=0

# --- Umbra graphical boot theme (graphite + gold) ---
# Mirrors Debian's working grub-mkconfig output: establish the graphical
# framebuffer UNCONDITIONALLY (terminal_output gfxterm outside the font test),
# then load the gfxmenu theme with an explicit ($root) device prefix so the
# paths resolve against the ISO rather than the BIOS El Torito image.
insmod all_video
insmod gfxterm
set gfxmode=1024x768,auto
terminal_output gfxterm

insmod gfxmenu
insmod png
if loadfont ($root)/boot/grub/themes/umbra/dejavu-18.pf2 ; then
    loadfont ($root)/boot/grub/themes/umbra/dejavu-bold-24.pf2
    set theme=($root)/boot/grub/themes/umbra/theme.txt
    export theme
fi

# Fallback colors if the gfxmenu theme fails to load for any reason
set menu_color_normal=light-gray/black
set menu_color_highlight=black/yellow

menuentry "Shadowfetch Linux — Fire  (run hot: gold, agents may use the network)" --class linux {
    linux  /live/vmlinuz boot=live components username=shadow hostname=shadowfetch quiet splash sf.element=fire
    initrd /live/initrd.img
}

menuentry "Shadowfetch Linux — Ice   (run cold: azure, agent sandboxes offline)" --class linux {
    linux  /live/vmlinuz boot=live components username=shadow hostname=shadowfetch quiet splash sf.element=ice
    initrd /live/initrd.img
}

menuentry "Shadowfetch Linux (live, safe graphics)" --class linux {
    linux  /live/vmlinuz boot=live components username=shadow hostname=shadowfetch nomodeset
    initrd /live/initrd.img
}

menuentry "Shadowfetch Linux (live, verbose)" --class linux {
    linux  /live/vmlinuz boot=live components username=shadow hostname=shadowfetch
    initrd /live/initrd.img
}

menuentry "Shadowfetch Linux (live, debug shell)" --class linux {
    linux  /live/vmlinuz boot=live components username=shadow hostname=shadowfetch break=top
    initrd /live/initrd.img
}
