---
userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
autologinGroup:  autologin
sudoersGroup:    sudo
setRootPassword: false

passwordRequirements:
    minLength: 8  # Password at least this many characters
    maxLength: -1  # Password at most this many characters


hostname:
    location: EtcFile
    writeHostsFile: true
    template: "${first}-pc"
    forbiddenNames: [ localhost ]

# Reserved/system login names that collide with useradd -U (existing groups)
# or are system accounts. 'shadow' is the Debian system group (GID 42) for
# /etc/shadow access, so it can never be a useradd -U target.
user:
  forbidden_names: [ root, admin, administrator, shadow, guest, user, users, daemon, bin, sys, sync, games, man, lp, mail, news, uucp, proxy, backup, list, irc, nobody, www-data, systemd, sudo, audio, video, staff ]
