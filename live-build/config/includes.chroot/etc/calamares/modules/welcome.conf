---
# Shadowfetch override of calamares-settings-debian's welcome.conf.
#
# Upstream ships requiredStorage 15 / requiredRam 1.0 with storage and ram in both
# `check` and `required`. The published hardware page documents 40 GB of storage
# and 4 GB of RAM as the minimum, so the installer accepted a 35 GiB disk with no
# warning at any step -- verified by completing a real install on one.
#
# The numbers now match the documentation. But storage and ram are deliberately
# left OUT of `required` and only in `check`: they warn, they do not block. The
# resulting install occupies 7.0 GiB, so 15 GiB genuinely works, and blocking
# would lock out installs that succeed today. Telling the user and letting them
# choose is the honest position; silently accepting a third of the documented
# minimum was not.
#
# `root` stays required -- an install with no root privileges cannot proceed at all.
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    true

requirements:
    requiredStorage:    40
    requiredRam:        4.0
    # Calamares requires a configured connectivity target even though this
    # offline-capable installer does not make internet a prerequisite.
    internetCheckUrl:   https://www.shadowfetchlinux.org/
    check:
        - storage
        - ram
        - power
        - root
    required:
        - root
