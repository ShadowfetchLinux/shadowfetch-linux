<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Bus policy for the Shadowfetch Fireproof update daemon.

     Default deny, then an explicit allowlist. The previous policy allowed
     any sender to reach any member of a root-owned service, on the reasoning
     that every mutating method checks polkit internally. Verify did not: it
     ran the dpkg audit and an apt dependency simulation as root for any
     caller. Enumerating members means a method added without an auth check
     is unreachable until it is listed here deliberately. -->
<busconfig>
  <policy user="root">
    <allow own="org.shadowfetch.Fireproof1"/>
    <allow send_destination="org.shadowfetch.Fireproof1"/>
  </policy>

  <policy context="default">
    <deny send_destination="org.shadowfetch.Fireproof1"/>

    <!-- Read-only, side-effect free, cheap. -->
    <allow send_destination="org.shadowfetch.Fireproof1"
           send_interface="org.shadowfetch.Fireproof1" send_member="GetState"/>
    <allow send_destination="org.shadowfetch.Fireproof1"
           send_interface="org.shadowfetch.Fireproof1" send_member="RollbackTarget"/>
    <allow send_destination="org.shadowfetch.Fireproof1"
           send_interface="org.shadowfetch.Fireproof1" send_member="Inspect"/>

    <!-- Unauthenticated by design (the tray badge), bounded in the daemon by
         a result cache and caller coalescing. -->
    <allow send_destination="org.shadowfetch.Fireproof1"
           send_interface="org.shadowfetch.Fireproof1" send_member="Analyze"/>

    <!-- Each of these checks polkit against the caller inside the daemon. -->
    <allow send_destination="org.shadowfetch.Fireproof1"
           send_interface="org.shadowfetch.Fireproof1" send_member="Verify"/>
    <allow send_destination="org.shadowfetch.Fireproof1"
           send_interface="org.shadowfetch.Fireproof1" send_member="Update"/>
    <allow send_destination="org.shadowfetch.Fireproof1"
           send_interface="org.shadowfetch.Fireproof1" send_member="CancelDownload"/>
    <allow send_destination="org.shadowfetch.Fireproof1"
           send_interface="org.shadowfetch.Fireproof1" send_member="ProceedCommit"/>
    <allow send_destination="org.shadowfetch.Fireproof1"
           send_interface="org.shadowfetch.Fireproof1" send_member="AbortCommit"/>
    <allow send_destination="org.shadowfetch.Fireproof1"
           send_interface="org.shadowfetch.Fireproof1" send_member="RecordRollback"/>

    <!-- Standard interfaces: properties are read-only (Set always raises). -->
    <allow send_destination="org.shadowfetch.Fireproof1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.shadowfetch.Fireproof1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.shadowfetch.Fireproof1"
           send_interface="org.freedesktop.DBus.Peer"/>

    <allow receive_sender="org.shadowfetch.Fireproof1"/>
  </policy>
</busconfig>
